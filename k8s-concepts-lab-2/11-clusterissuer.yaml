# ClusterIssuer (dùng chung toàn cluster, thay cho việc lặp lại Issuer namespaced ở từng app)
# -> cấp cert Let's Encrypt cho zone thanhlam.online qua Cloudflare DNS-01
# Secret token nằm trong namespace "cert-manager" (nơi cert-manager cấu hình --cluster-resource-namespace)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-thanhlam
spec:
  acme:
    email: dthanhlam.1004@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-thanhlam-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-thanhlam
              key: api-token
        selector:
          dnsZones:
            - thanhlam.online
