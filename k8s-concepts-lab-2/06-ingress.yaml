# Ingress -> rule routing: host lab2.thanhlam.online -> Service "web" port 80, HTTPS qua cert-manager (Let's Encrypt/Cloudflare DNS-01)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: lab2
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    cert-manager.io/cluster-issuer: letsencrypt-thanhlam
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - lab2.thanhlam.online
      secretName: lab2-thanhlam-online-tls
  rules:
    - host: lab2.thanhlam.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
